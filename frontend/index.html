<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <title>Intelligence Workspace — Full-Stack &amp; GenAI Developer Portfolio</title>
    <meta
      name="description"
      content="Portfolio of a full-stack developer building web applications with Generative AI and agentic workflows. Case studies covering architecture, engineering trade-offs and verified results."
    />
    <meta name="author" content="Ram Kumar Yadav" />
    <meta name="theme-color" content="#11152A" />
    <meta name="color-scheme" content="dark light" />

    <!--
      Theme boot. Runs before first paint so a returning visitor never sees the
      default colours flash before their own theme is applied.

      This deliberately duplicates the read/validate/resolve logic in
      src/lib/theme.ts — it has to run before any module loads, so it cannot
      import it. Keep the two in step: the storage key, the default accent and
      the shape of the stored value all have to agree. The stored value is
      treated as untrusted here as well, because storage is user-writable.
    -->
    <script>
      (function () {
        try {
          var stored = JSON.parse(localStorage.getItem('iw-theme') || 'null') || {}
          var mode =
            stored.mode === 'light' || stored.mode === 'dark' || stored.mode === 'system'
              ? stored.mode
              : 'dark'
          var accent = /^#[0-9a-f]{6}$/i.test(stored.accent) ? stored.accent : '#a77bff'
          var resolved =
            mode === 'system'
              ? window.matchMedia('(prefers-color-scheme: dark)').matches
                ? 'dark'
                : 'light'
              : mode

          var root = document.documentElement
          root.style.setProperty('--accent-source', accent)
          root.setAttribute('data-theme', resolved)

          var meta = document.querySelector('meta[name="theme-color"]')
          if (meta) meta.setAttribute('content', resolved === 'light' ? '#f6f7fb' : '#11152a')
        } catch (error) {
          /* Blocked storage or a malformed value: the CSS defaults are correct. */
        }
      })()
    </script>

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap"
    />

    <!--
      Open Graph / social preview.
      TODO(owner): once the site is deployed, point og:image at an absolute URL
      (https://your-domain.com/og-image.png) and add
      <meta property="og:url" content="https://your-domain.com/" />.
      Social crawlers do not resolve relative image paths.
    -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Intelligence Workspace" />
    <meta
      property="og:title"
      content="Intelligence Workspace — Full-Stack &amp; GenAI Developer Portfolio"
    />
    <meta
      property="og:description"
      content="Full-stack applications, GenAI experiences and agentic systems — with the architecture and engineering decisions behind them."
    />
    <meta property="og:image" content="/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Intelligence Workspace — portfolio cover" />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
